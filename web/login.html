<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DOSL HUB - ログイン</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Roboto', 'Noto Sans JP', sans-serif;
      background: linear-gradient(160deg, #1565c0 0%, #1976d2 55%, #42a5f5 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .login-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
      padding: 40px 32px;
      width: 100%;
      max-width: 400px;
    }
    .brand {
      text-align: center;
      margin-bottom: 28px;
    }
    .brand .logo {
      width: 56px; height: 56px;
      background: #1976d2;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      margin-bottom: 12px;
    }
    .brand h1 { font-size: 22px; font-weight: 700; color: #212121; letter-spacing: 0.5px; }
    .brand p { font-size: 13px; color: #757575; margin-top: 4px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; color: #616161; margin-bottom: 6px; }
    .field input {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      font-family: inherit;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .field input:focus { border-color: #1976d2; box-shadow: 0 0 0 3px rgba(25,118,210,0.15); }
    .btn-login {
      width: 100%;
      padding: 13px;
      background: #1976d2;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s;
    }
    .btn-login:hover { background: #1565c0; }
    .btn-login:disabled { background: #bdbdbd; cursor: not-allowed; }
    .error {
      display: none;
      background: #ffebee;
      color: #c62828;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 16px;
    }
    .error.show { display: block; }
    .footer-note { text-align: center; font-size: 12px; color: #9e9e9e; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <div class="logo"><span class="material-icons" style="font-size:30px">hub</span></div>
      <h1>DOSL HUB</h1>
      <p>展示会ドキュメント管理システム</p>
    </div>
    <div class="error" id="errorBox"></div>
    <form id="loginForm">
      <div class="field">
        <label for="email">メールアドレス</label>
        <input type="email" id="email" autocomplete="username" required placeholder="you@example.com" />
      </div>
      <div class="field">
        <label for="password">パスワード</label>
        <input type="password" id="password" autocomplete="current-password" required placeholder="パスワード" />
      </div>
      <button type="submit" class="btn-login" id="btnLogin">ログイン</button>
    </form>
    <p class="footer-note">アカウントは主催事務局から発行されます</p>
  </div>

  <script src="app.js"></script>
  <script>
    // ログイン済みなら各ポータルへ
    const existing = getUser();
    if (getToken() && existing) {
      location.href = existing.role === 'exhibitor' ? 'index.html' : 'admin.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      const errorBox = document.getElementById('errorBox');
      errorBox.classList.remove('show');
      btn.disabled = true;
      btn.textContent = 'ログイン中...';
      try {
        const res = await api('/api/auth/login', {
          method: 'POST',
          body: {
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          },
        });
        setAuth(res.access_token, res.user);
        location.href = res.user.role === 'exhibitor' ? 'index.html' : 'admin.html';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'ログイン';
      }
    });
  </script>
</body>
</html>
